    <div class="foot"><span>El catálogo</span><span class="mark">Pan Gocho</span></div>`;
  crumb.innerHTML = `El catálogo › <b>${esc(p.n)}</b>`;
  back.classList.add('on');
  mostrar(TOOL);
  if(push!==false) history.pushState({t:'pan',i},'','#pan-'+i);
}

/* ══ Navegación ══ */
const HOME=document.getElementById('s-home'), LIBRO=document.getElementById('s-libro'),
      SEC=document.getElementById('s-seccion');
const back=document.getElementById('back'), crumb=document.getElementById('crumb'),
      topbar=document.getElementById('chrome');
let libroActual=null;

function mostrar(el){
  [HOME,LIBRO,SEC,document.getElementById('s-tool')].forEach(s=>s.classList.remove('live','entering'));
  el.classList.add('live','entering');
  el.addEventListener('animationend',()=>el.classList.remove('entering'),{once:true});
  window.scrollTo({top:0,behavior:'instant'});
}
function irInicio(){
  libroActual=null;
  crumb.innerHTML='<b>El Secreto del Pan Gocho</b>';
  back.classList.remove('on');
  mostrar(HOME);
}
function irLibro(o, push){
  libroActual=o;
  pintarAcento(o);
  const bloqueado = UPSELL.includes(o) && !abiertos().includes(o.id);
  /* La única pantalla que no scrollea entera es la del chat, y solo
     cuando ya está abierto: el candado sí es una página normal. */
  LIBRO.classList.toggle('charla', !!o.chat && !bloqueado);
  if(bloqueado)      pintarCandado(o);
  else if(o.chat)    pintarRonald(o);
  else               pintarLibro(o);
  crumb.innerHTML=`Inicio › <b>${esc(o.n)}</b>`;
  back.classList.add('on');
  mostrar(LIBRO);
  if(push!==false) history.pushState({t:'libro',id:o.id},'','#'+o.id);
}
function irSeccion(i, push){
  pintarAcento(libroActual);
  pintarSeccion(libroActual, i);
  crumb.innerHTML=`${esc(libroActual.n)} › <b>${esc(libroActual.datos.secciones[i].titulo)}</b>`;
  mostrar(SEC);
  if(push!==false) history.pushState({t:'sec',id:libroActual.id,i},'','#'+libroActual.id+'/'+i);
}

const TODOS = () => [...MODULOS, ...REGALOS, ...UPSELL];

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-go]');
  if(t){ const o=TODOS().find(x=>x.id===t.dataset.go); if(o) irLibro(o); return; }
  const f=e.target.closest('[data-sec]');
  if(f && libroActual?.datos){ irSeccion(+f.dataset.sec); return; }
  const h=e.target.closest('[data-tool]');
  if(h){ irTool(h.dataset.tool); return; }
  const fh=e.target.closest('[data-ficha]');
  if(fh){ irTool('ficha'+fh.dataset.ficha); return; }
  const pn=e.target.closest('[data-pan]');
  if(pn){ irPan(+pn.dataset.pan); return; }
  const g2=e.target.closest('[data-go2]');
  if(g2){ const o=TODOS().find(x=>x.id===g2.dataset.go2);
          if(o){ irLibro(o); if(g2.dataset.sec2!==undefined && o.datos) irSeccion(+g2.dataset.sec2); } }
});
back.addEventListener('click', ()=>history.back());
addEventListener('popstate', e=>{
  const st=e.state;
  if(!st) return irInicio();
  if(st.t==='tool'){ irTool(st.id,false); return; }
  if(st.t==='pan'){ irPan(st.i,false); return; }
  if(st.t==='ayuda'){ preguntar(st.q); history.replaceState(st,'','#ayuda'); return; }
  const o=TODOS().find(x=>x.id===st.id);
  if(!o) return irInicio();
  if(st.t==='tool'){ irTool(st.id,false); return; }
  if(st.t==='sec'){ libroActual=o; irSeccion(st.i,false); } else irLibro(o,false);
});
addEventListener('scroll', ()=> topbar.classList.toggle('scrolled', scrollY>6), {passive:true});

/* El destello viaja con el dedo: se dispara al tocar, no al soltar,
   para que la respuesta sea inmediata. Y se limpia solo al terminar,
   así vuelve a dispararse las veces que quieran. */
document.addEventListener('pointerdown', e=>{
  const t = e.target.closest('.tapa.locked');
  if(!t) return;
  t.classList.remove('destella');
  void t.offsetWidth;              // reinicia la animación
  t.classList.add('destella');
  t.addEventListener('animationend', ()=>t.classList.remove('destella'), {once:true});
}, {passive:true});

pintarInicio();
/* Enlace directo: #g1 abre el regalo, #g1/5 abre su sección 5.
   Y #o1/CIUDAD abre el upsell YA DESBLOQUEADO: el que pagó llega
   desde la página de gracias con un clic y no tiene que copiar
   ningún código a mano. El candado sigue existiendo para el que
   entra de otra forma. */
if(location.hash.length>1){
  const h=location.hash.slice(1);
  if(h.startsWith('tool-')){ irTool(h.slice(5),false); }
  else if(h.startsWith('pan-')){ irPan(+h.slice(4),false); }
  else{
    const [id,i]=h.split('/');
    const o=TODOS().find(x=>x.id===id);
    const cod=i ? String(i).trim().toUpperCase() : '';
    const abrirYa=()=>{
      abrir(o.id);
      history.replaceState(null,'','#'+o.id);   // el código no queda en la barra
      pintarInicio(); irLibro(o,false);
    };
    if(o && cod && o.verificar){
      /* Ronald: el código lo confirma el worker, así que hay que
         esperar. Mientras tanto se pinta el candado — si el código
         sirve, se reemplaza solo en menos de un segundo. */
      irLibro(o,false);
      o.verificar(cod).then(r=>{ if(r===true) abrirYa(); });
    }
    else if(o && cod && o.codigo && cod===o.codigo){ abrirYa(); }
    else if(o){ irLibro(o,false); if(i!==undefined && o.datos) irSeccion(+i,false); }
  }
}
</script>
</body>
</html>
